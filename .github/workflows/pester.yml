name: Pester Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: pester-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pwsh:
    name: Pester (pwsh)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate PowerShell parser
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path './sccmpatch.ps1'), [ref]$null, [ref]$errors
          )
          if ($errors) {
              $errors | Format-List
              exit 1
          }

      - name: Ensure Pester 5 is available
        shell: pwsh
        run: |
          $pester = Get-Module -ListAvailable -Name Pester |
              Where-Object { $_.Version.Major -ge 5 } |
              Sort-Object Version -Descending |
              Select-Object -First 1
          if (-not $pester) {
              Install-Module -Name Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: Run Pester tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'testResults-pwsh.xml'
          $config.TestResult.OutputFormat = 'NUnitXml'
          Invoke-Pester -Configuration $config

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results-pwsh
          path: testResults-pwsh.xml
          if-no-files-found: warn

  windows-powershell:
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    name: Pester (Windows ${{ matrix.shell }})
    defaults:
      run:
        shell: ${{ matrix.shell }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate PowerShell parser
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path './sccmpatch.ps1'), [ref]$null, [ref]$errors
          )
          if ($errors) {
              $errors | Format-List
              exit 1
          }

      - name: Ensure Pester 5 is available
        run: |
          $pester = Get-Module -ListAvailable -Name Pester |
              Where-Object { $_.Version.Major -ge 5 } |
              Sort-Object Version -Descending |
              Select-Object -First 1
          if (-not $pester) {
              Install-Module -Name Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: Run Pester tests
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'testResults-windows-${{ matrix.shell }}.xml'
          $config.TestResult.OutputFormat = 'NUnitXml'
          Invoke-Pester -Configuration $config

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results-windows-${{ matrix.shell }}
          path: testResults-windows-${{ matrix.shell }}.xml
          if-no-files-found: warn

name: Pester Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: pester-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Pester (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pwsh
            os: ubuntu-latest
            shell: pwsh
          - name: windows-powershell
            os: windows-latest
            shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate PowerShell parser
        shell: ${{ matrix.shell }}
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path './sccmpatch.ps1'), [ref]$null, [ref]$errors
          )
          if ($errors) {
              $errors | Format-List
              exit 1
          }

      - name: Ensure Pester 5 is available
        shell: ${{ matrix.shell }}
        run: |
          $pester = Get-Module -ListAvailable -Name Pester |
              Where-Object { $_.Version.Major -ge 5 } |
              Sort-Object Version -Descending |
              Select-Object -First 1
          if (-not $pester) {
              Install-Module -Name Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: Run Pester tests
        shell: ${{ matrix.shell }}
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'testResults-${{ matrix.name }}.xml'
          $config.TestResult.OutputFormat = 'NUnitXml'
          Invoke-Pester -Configuration $config

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results-${{ matrix.name }}
          path: testResults-${{ matrix.name }}.xml
          if-no-files-found: warn
